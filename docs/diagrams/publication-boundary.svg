<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" preserveAspectRatio="xMidYMid meet">
  <title id="title">Sidelore publication boundary</title>
  <desc id="desc">A local workspace is frozen into an immutable snapshot, reviewed and approved, then placed in an approved publication library before any P2P, HTTP, or index transport can see it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b101f"/>
      <stop offset="0.56" stop-color="#161a31"/>
      <stop offset="1" stop-color="#102c35"/>
    </linearGradient>
    <linearGradient id="private" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332040"/>
      <stop offset="1" stop-color="#1a2039"/>
    </linearGradient>
    <linearGradient id="public" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d43"/>
      <stop offset="1" stop-color="#12304a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bca6ff"/>
      <stop offset="1" stop-color="#7964df"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af0dc"/>
      <stop offset="1" stop-color="#32b7b0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#b8c4e1" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00030d" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#80e8d6"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; }
      .title { fill: #f8f7ff; font-size: 34px; font-weight: 700; letter-spacing: -0.6px; }
      .subtitle { fill: #aaaec8; font-size: 18px; }
      .kicker { fill: #c3b1ff; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; }
      .kickerTeal { fill: #7ee8d4; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; }
      .cardTitle { fill: #fbfbff; font-size: 21px; font-weight: 700; }
      .cardText { fill: #b5b8d1; font-size: 16px; }
      .micro { fill: #8f96b7; font-size: 13px; }
      .pill { fill: #eef3ff; font-size: 14px; font-weight: 700; letter-spacing: 0.6px; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="898" rx="29" fill="url(#grid)" stroke="#9d9cc7" stroke-opacity="0.2"/>
  <circle cx="1220" cy="445" r="300" fill="#39c8b6" opacity="0.06" filter="url(#glow)"/>

  <text x="80" y="76" class="sans kicker">SIDELORE / PUBLICATION CONTROL</text>
  <text x="80" y="122" class="sans title">Private work crosses one deliberate boundary</text>
  <text x="80" y="151" class="sans subtitle">The network can read only the immutable snapshot that a person or bounded grant approved.</text>

  <rect x="70" y="205" width="700" height="510" rx="30" fill="#251d3a" fill-opacity="0.28" stroke="#7763a5" stroke-opacity="0.48"/>
  <rect x="830" y="205" width="700" height="510" rx="30" fill="#11353d" fill-opacity="0.26" stroke="#4d9c9a" stroke-opacity="0.48"/>
  <text x="110" y="255" class="sans kicker">LOCAL BY DEFAULT</text>
  <text x="870" y="255" class="sans kickerTeal">NETWORK VISIBLE AFTER APPROVAL</text>
  <path d="M800 210V710" stroke="#c1b6ff" stroke-opacity="0.3" stroke-dasharray="5 12"/>

  <g>
    <rect filter="url(#shadow)" x="105" y="315" width="285" height="270" rx="24" fill="url(#private)" stroke="#8b72b8" stroke-opacity="0.8"/>
    <circle cx="155" cy="366" r="25" fill="#3b2e58" stroke="#c1b0ff" stroke-width="2"/>
    <path d="M145 364a10 10 0 0 1 20 0v6h-20Zm-4 6h28v20h-28Z" fill="none" stroke="#ded4ff" stroke-width="2.5"/>
    <text x="200" y="365" class="sans cardTitle">Workspace</text>
    <text x="200" y="392" class="sans micro">only this node can read it</text>
    <text x="140" y="458" class="sans cardText">Drafts &amp; attempts</text>
    <text x="140" y="490" class="sans cardText">Private references</text>
    <text x="140" y="522" class="sans cardText">Attachments + filenames</text>
    <text x="140" y="554" class="sans micro">No transport access</text>
  </g>

  <g>
    <rect filter="url(#shadow)" x="445" y="315" width="285" height="270" rx="24" fill="#242343" stroke="#8779c7" stroke-opacity="0.8"/>
    <circle cx="495" cy="366" r="25" fill="#39366d" stroke="#c1b0ff" stroke-width="2"/>
    <path d="M495 349l15 7v11c0 11-7 18-15 22-8-4-15-11-15-22v-11Z" fill="none" stroke="#ded4ff" stroke-width="2.5"/>
    <path d="m488 366 5 5 10-11" fill="none" stroke="#ded4ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="540" y="365" class="sans cardTitle">Freeze</text>
    <text x="540" y="392" class="sans micro">make the reviewable CID</text>
    <text x="480" y="458" class="sans cardText">Selected records</text>
    <text x="480" y="490" class="sans cardText">Dependencies &amp; sizes</text>
    <text x="480" y="522" class="sans cardText">Destination network</text>
    <text x="480" y="554" class="sans micro">Any edit creates a new snapshot</text>
  </g>

  <g>
    <rect filter="url(#shadow)" x="855" y="315" width="285" height="270" rx="24" fill="#1b3948" stroke="#59b5ac" stroke-opacity="0.85"/>
    <circle cx="905" cy="366" r="25" fill="#24515a" stroke="#8cefe0" stroke-width="2"/>
    <path d="M897 366h16M905 358v16" stroke="#d2fff4" stroke-width="2.8" stroke-linecap="round"/>
    <text x="950" y="365" class="sans cardTitle">Approve</text>
    <text x="950" y="392" class="sans micro">human or bounded grant</text>
    <text x="890" y="458" class="sans cardText">Review warnings</text>
    <text x="890" y="490" class="sans cardText">Check public dependencies</text>
    <text x="890" y="522" class="sans cardText">Sign the exact CID</text>
    <text x="890" y="554" class="sans micro">No self-granted authority</text>
  </g>

  <g>
    <rect filter="url(#shadow)" x="1195" y="315" width="285" height="270" rx="24" fill="url(#public)" stroke="#58bdb1" stroke-opacity="0.85"/>
    <circle cx="1245" cy="366" r="25" fill="#22565c" stroke="#8cefe0" stroke-width="2"/>
    <path d="M1233 366h24M1245 354v24M1237 358c6 5 10 5 16 0M1237 374c6-5 10-5 16 0" fill="none" stroke="#d2fff4" stroke-width="2" stroke-linecap="round"/>
    <text x="1290" y="365" class="sans cardTitle">Public library</text>
    <text x="1290" y="392" class="sans micro">outward path only</text>
    <text x="1230" y="458" class="sans cardText">Signed envelope + CID</text>
    <text x="1230" y="490" class="sans cardText">P2P / HTTP / indexes</text>
    <text x="1230" y="522" class="sans cardText">Remote verification</text>
    <text x="1230" y="554" class="sans micro">Copies may outlive withdrawal</text>
  </g>

  <path d="M390 450H432" fill="none" stroke="#b9a9ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M730 450H842" fill="none" stroke="#b9a9ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1140 450H1182" fill="none" stroke="#83e8d6" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="70" y="770" width="1460" height="62" rx="20" fill="#0c1728" stroke="#4f5c78" stroke-opacity="0.75"/>
  <circle cx="108" cy="801" r="8" fill="#b9a9ff"/>
  <text x="132" y="808" class="sans pill">SAVE ≠ PUBLISH</text>
  <circle cx="410" cy="801" r="8" fill="#b9a9ff"/>
  <text x="434" y="808" class="sans pill">SUBSCRIBE ≠ CONSENT</text>
  <circle cx="770" cy="801" r="8" fill="#83e8d6"/>
  <text x="794" y="808" class="sans pill">CID-BOUND APPROVAL</text>
  <circle cx="1110" cy="801" r="8" fill="#83e8d6"/>
  <text x="1134" y="808" class="sans pill">REMOTE COPIES ARE HONESTLY VISIBLE</text>
</svg>
